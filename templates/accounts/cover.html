{% extends 'base.html' %}

{% block title %}HIVEMIND - Home{% endblock %}

{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap');

  body { 
    background: linear-gradient(90deg, hsla(221, 55%, 45%, 1) 0%, hsla(220, 78%, 18%, 1) 100%);
    min-height: 100vh;
  }

  .cover-wrap {
    min-height: 90vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 40px 20px;
  }

  .cover-title {
    font-family: 'Righteous', cursive; font-size: 80px;
    color: white;
    text-shadow: 0 4px 24px rgba(0,0,80,0.2);
    margin-bottom: 8px;
  }

  .cover-sub { 
    font-family: 'Nunito', sans-serif; font-size: 13px; 
    color: rgba(255,255,255,0.7); letter-spacing: 3px; 
    text-transform: uppercase; margin-bottom: 12px; 
  }

  .cover-desc { 
    font-family: 'Nunito', sans-serif; font-size: 15px; 
    color: rgba(255,255,255,0.75); max-width: 420px; 
    line-height: 1.7; margin-bottom: 36px; 
  }

  .cover-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  .btn-cover-primary {
    padding: 13px 36px; border-radius: 50px; border: none; cursor: pointer;
    background: white; color: #103783;
    font-size: 15px; font-weight: 700; font-family: 'Nunito', sans-serif;
    text-decoration: none; transition: all 0.25s;
    box-shadow: 0 6px 20px rgba(0,0,80,0.2);
  }
  .btn-cover-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,80,0.3); color: #103783; }

  .btn-cover-secondary {
    padding: 13px 36px; border-radius: 50px; cursor: pointer;
    background: rgba(255,255,255,0.15); color: white;
    border: 1.5px solid rgba(255,255,255,0.4);
    font-size: 15px; font-weight: 700; font-family: 'Nunito', sans-serif;
    text-decoration: none; transition: all 0.25s;
    backdrop-filter: blur(8px);
  }
  .btn-cover-secondary:hover { transform: translateY(-2px); background: rgba(255,255,255,0.25); color: white; }

  .cover-footer { margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; font-family: 'Nunito', sans-serif; }

  .doodle { position: fixed; opacity: 0.08; pointer-events: none; animation: floatD var(--dur,6s) ease-in-out infinite alternate; }
  @keyframes floatD { 0%{transform:translate(0,0) rotate(var(--r0,0deg));} 100%{transform:translate(var(--tx,8px),var(--ty,-10px)) rotate(var(--r1,5deg));} }
</style>

<div class="cover-wrap">
  <div class="cover-sub">Your Academic Command Center</div>
  <div class="cover-title">HIVEMIND</div>
  <div class="cover-desc">One platform to track, manage, and organize everything that matters in your academic life.</div>
  <div class="cover-btns">
    <a href="{% url 'register' %}" class="btn-cover-primary">Get Started →</a>
    <a href="{% url 'login' %}" class="btn-cover-secondary">Sign In</a>
  </div>
  <div class="cover-footer">By Sumedha</div>
</div>
{% endblock %}
