{% extends 'base.html' %}

{% block title %}HIVEMIND - Home{% endblock %}

{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap');

  body { background: linear-gradient(135deg, #fff5f0 0%, #fff0f5 40%, #ffeef8 70%, #fff0ea 100%); }

  .cover-wrap {
    min-height: 80vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 40px 20px;
  }
  .cover-title {
    font-family: 'Righteous', cursive; font-size: 80px;
    background: linear-gradient(135deg, #ff6b6b, #ff8fab, #ffb347);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .cover-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #c09090; letter-spacing: 2px; margin-bottom: 12px; }
  .cover-desc { font-family: 'Nunito', sans-serif; font-size: 14px; color: #b08080; max-width: 400px; line-height: 1.7; margin-bottom: 32px; }
  .cover-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn-cover-primary {
    padding: 13px 36px; border-radius: 50px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #ff8c69); color: white;
    font-size: 15px; font-weight: 700; font-family: 'Nunito', sans-serif;
    text-decoration: none; transition: all 0.25s;
    box-shadow: 0 6px 20px rgba(255,100,120,0.3);
  }
  .btn-cover-primary:hover { transform: translateY(-2px); color: white; }
  .btn-cover-secondary {
    padding: 13px 36px; border-radius: 50px; cursor: pointer;
    background: rgba(255,255,255,0.7); color: #e06080;
    border: 1.5px solid rgba(255,150,150,0.4);
    font-size: 15px; font-weight: 700; font-family: 'Nunito', sans-serif;
    text-decoration: none; transition: all 0.25s;
  }
  .btn-cover-secondary:hover { transform: translateY(-2px); background: white; color: #e06080; }
  .cover-footer { margin-top: 40px; font-size: 11px; color: #d0a0a0; letter-spacing: 1px; }

  /* FLOATING DOODLES */
  .doodle { position: fixed; opacity: 0.15; pointer-events: none; animation: floatD var(--dur, 6s) ease-in-out infinite alternate; }
  @keyframes floatD { 0%{transform:translate(0,0) rotate(var(--r0,0deg));} 100%{transform:translate(var(--tx,8px),var(--ty,-10px)) rotate(var(--r1,5deg));} }
</style>

<!-- FLOATING DOODLES -->

<div class="cover-wrap">

{% endblock %}
