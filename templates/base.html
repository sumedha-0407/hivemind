<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HIVEMIND{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        #grid-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .doodles-wrap {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
            overflow: hidden;
        }
        .doodle {
            position: absolute;
            opacity: 0.22;
            animation: floatD var(--dur, 6s) ease-in-out infinite alternate;
        }
        @keyframes floatD {
            0% { transform: translate(0, 0) rotate(var(--r0, 0deg)); }
            100% { transform: translate(var(--tx, 6px), var(--ty, -8px)) rotate(var(--r1, 5deg)); }
        }
        .content-wrap { position: relative; z-index: 2; }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}
    <script>
        const canvas = document.getElementById('grid-canvas');
        if(canvas) {
            const ctx = canvas.getContext('2d');
            const SQUARE_SIZE = 26;
            const BORDER_COLOR = 'rgba(255, 255, 255, 0.04)';
            const DIAGONAL_SPEED = 0.3;
            let offset = 0;
            let cols, rows, squares = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                cols = Math.ceil(canvas.width / SQUARE_SIZE) + 2;
                rows = Math.ceil(canvas.height / SQUARE_SIZE) + 2;
                squares = [];
                for (let r = 0; r < rows; r++)
                    for (let c = 0; c < cols; c++)
                        squares.push({ col: c, row: r });
            }

            window.addEventListener('resize', resize);
            resize();

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                offset = (offset + DIAGONAL_SPEED) % SQUARE_SIZE;
                squares.forEach(sq => {
                    const x = sq.col * SQUARE_SIZE - offset;
                    const y = sq.row * SQUARE_SIZE - offset;
                    ctx.strokeStyle = BORDER_COLOR;
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, y, SQUARE_SIZE, SQUARE_SIZE);
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
    {% endblock extra_js %}
</body>
</html>
